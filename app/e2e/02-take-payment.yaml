appId: com.straumur.taptopay.sample
name: Take a payment
---
# Takes a payment on an already-boarded device: the app POSTs the amount to your backend
# (/api/payments), which has Straumur pre-create the payment and return a nexo SaleToPOIRequest,
# then hands that to the Adyen SDK.
#
# Run 01-setup-device.yaml first (this flow assumes the device is boarded).
#
# CEILING: the flow stops where the Adyen SDK takes over the screen. The contactless read is
# physical NFC hardware — no e2e tool can simulate the card tap. Present a test card by hand to
# carry it through to the result dialog.

- launchApp # keep state: the stored POIID means we land straight on the charge screen

- assertVisible: "Take a payment"

- tapOn: "0.00" # the amount field, by its placeholder
- inputText: "1990"
- hideKeyboard

- tapOn: "Charge"

# From here the Adyen SDK presents its own tap UI and the shopper taps the card. Everything
# below only passes with a real card presented, so it is commented out for unattended runs.
#
# - extendedWaitUntil:
#     visible: "Approved"
#     timeout: 120000
# - tapOn: "OK"
